name: Windows

# The Windows port, step 1: what of Spola runs on Windows as it is. The tests
# and the window, under MSYS2's GTK 4 and libadwaita (the recipe of
# p7m-extractor and pdf-cropper; UCRT64, the only one with libadwaita),
# with a local folder as the "Koofr" side.

on:
  push:
    branches: [windows]
  workflow_dispatch:

env:
  SPOLA_RCLONE_RELEASE: "1.75.2"

jobs:
  probe:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            unzip
            gettext
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
      - name: rclone for Windows
        run: |
          curl -fsSL -o rclone.zip "https://github.com/rclone/rclone/releases/download/v${SPOLA_RCLONE_RELEASE}/rclone-v${SPOLA_RCLONE_RELEASE}-windows-amd64.zip"
          unzip -q rclone.zip
          echo "SPOLA_RCLONE=$(cygpath -w "$PWD/rclone-v${SPOLA_RCLONE_RELEASE}-windows-amd64/rclone.exe")" >> "$GITHUB_ENV"
      - name: Versions
        run: |
          python --version
          python -c "import gi; gi.require_version('Gtk', '4.0'); gi.require_version('Adw', '1'); from gi.repository import Gtk, Adw; print('GTK', Gtk.MAJOR_VERSION, Gtk.MINOR_VERSION, 'Adw', Adw.MAJOR_VERSION, Adw.MINOR_VERSION)"
          "$SPOLA_RCLONE" version | head -1
          # MSYS2's Python takes "/" as the separator when MSYSTEM is set; the
          # installed app never has it, so the tests and the window run without
          python -c "import os, tempfile; print('with MSYSTEM:', os.name, repr(os.sep), tempfile.gettempdir())"
          env -u MSYSTEM python -c "import os, tempfile; print('without:', os.name, repr(os.sep), tempfile.gettempdir())"
      - run: python tools/compile_po.py
      - name: rclone's logs on Windows (fixtures)
        continue-on-error: true
        run: |
          env -u MSYSTEM python tools/windows_log_sample.py logs
          # as the window runs it: no console (Stop must still be graceful)
          mkdir -p logs-detached
          env -u MSYSTEM python -c "import subprocess, sys; out = open('logs-detached/run.txt', 'w'); subprocess.run([sys.executable, 'tools/windows_log_sample.py', 'logs-detached'], creationflags=subprocess.DETACHED_PROCESS, stdout=out, stderr=out, timeout=300)"
          cat logs/interrupted.txt logs-detached/interrupted.txt logs-detached/run.txt || true
      - name: Tests
        continue-on-error: true
        run: env -u MSYSTEM python -m unittest discover -s tests -v 2>&1 | tee tests.log
      - name: The window
        continue-on-error: true
        run: |
          OUT="$(cygpath -w "$PWD/gui")"
          mkdir -p gui/config gui/state gui/data gui/remote
          export XDG_CONFIG_HOME="$OUT\\config" XDG_STATE_HOME="$OUT\\state" XDG_DATA_HOME="$OUT\\data"
          export SPOLA_DEV_REMOTE="$OUT\\remote" SPOLA_SCREENSHOT="$OUT\\window.png" SPOLA_SCREENSHOT_DELAY=8
          timeout 120 env -u MSYSTEM python bin/spola 2>&1 | tee gui/run.log
          ls -la gui
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-probe
          path: |
            tests.log
            logs/
            logs-detached/
            gui/

  package:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            unzip
            zip
            gettext
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-ca-certificates
      - name: rclone for Windows, checked against the release's SHA256SUMS
        run: |
          base="https://github.com/rclone/rclone/releases/download/v${SPOLA_RCLONE_RELEASE}"
          zip="rclone-v${SPOLA_RCLONE_RELEASE}-windows-amd64.zip"
          curl -fsSL -o "$zip" "$base/$zip"
          curl -fsSL -o SHA256SUMS "$base/SHA256SUMS"
          grep " $zip\$" SHA256SUMS | sha256sum -c -
          unzip -q "$zip"
          echo "SPOLA_RCLONE=$(cygpath -w "$PWD/rclone-v${SPOLA_RCLONE_RELEASE}-windows-amd64/rclone.exe")" >> "$GITHUB_ENV"
      - name: Build with PyInstaller
        run: |
          python tools/compile_po.py
          python tools/make_ico.py
          pyinstaller --noconfirm build-aux/windows/spola.spec
      - name: Slim the bundle, icon themes and schemas in
        run: |
          I=dist/Spola/_internal
          mkdir -p "$I/share/glib-2.0/schemas" "$I/share/icons"
          [ -f "$I/share/glib-2.0/schemas/gschemas.compiled" ] || cp /ucrt64/share/glib-2.0/schemas/gschemas.compiled "$I/share/glib-2.0/schemas/"
          cp -rn /ucrt64/share/icons/Adwaita "$I/share/icons/" || true
          cp -rn /ucrt64/share/icons/hicolor "$I/share/icons/" || true
          [ -d "$I/share/locale" ] && find "$I/share/locale" -mindepth 1 -maxdepth 1 ! -name it ! -name 'en*' -exec rm -rf {} + || true
          rm -rf "$I/share/icons/AdwaitaLegacy" "$I/share/icons/Adwaita/cursors"
          gtk4-update-icon-cache -q -t -f "$I/share/icons/Adwaita"
          gtk4-update-icon-cache -q -t -f "$I/share/icons/hicolor"
          test -f "$I/rclone.exe" -o -f dist/Spola/rclone.exe
          test -f "$I/gdbus.exe" -o -f dist/Spola/gdbus.exe
          test -f "$I/share/locale/it/LC_MESSAGES/spola.mo"
          du -sm dist/Spola | cut -f1 | xargs -I{} echo "bundle: {} MB"
      - name: Smoke test (the real Spola.exe, a screenshot of its window)
        run: |
          mkdir -p smoke/config smoke/state smoke/data smoke/remote
          OUT="$(cygpath -w "$PWD/smoke")"
          export XDG_CONFIG_HOME="$OUT\\config" XDG_STATE_HOME="$OUT\\state" XDG_DATA_HOME="$OUT\\data"
          export SPOLA_DEV_REMOTE="$OUT\\remote" SPOLA_SCREENSHOT="$OUT\\window.png" SPOLA_SCREENSHOT_DELAY=8
          env -u MSYSTEM -u SPOLA_RCLONE timeout 120 ./dist/Spola/Spola.exe || true
          test -f smoke/window.png
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in v*) ;; *) VERSION=dev ;; esac
          cd dist && zip -qr "spola-${VERSION}-windows-x64-portable.zip" Spola
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME.Substring(1) } else { 'dev' }
          & $iscc "/DAppVersion=$version" "build-aux\windows\spola.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Update over a running Spola (Setup asks it to quit, ends what is left)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist -Filter 'spola-setup-*.exe' | Select-Object -First 1).FullName
          $opts = '/VERYSILENT', '/CURRENTUSER', '/SUPPRESSMSGBOXES', '/NORESTART'
          $p = Start-Process $setup -ArgumentList $opts -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "install: $($p.ExitCode)"; exit 1 }
          Start-Process "$env:LOCALAPPDATA\Programs\Spola\Spola.exe" -ArgumentList '--background'
          Start-Sleep 20
          if (-not (Get-Process Spola -ErrorAction SilentlyContinue)) { Write-Error 'Spola did not start'; exit 1 }
          $p = Start-Process $setup -ArgumentList ($opts + '/LOG=update.log') -Wait -PassThru
          Get-Content update.log | Select-String 'Spola is running|Spola quit|Ending|WMI|RestartManager|succeeded|Abort'
          if ($p.ExitCode -ne 0) { Write-Error "update over a running Spola: $($p.ExitCode)"; exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: spola-windows
          path: |
            dist/spola-setup-*.exe
            dist/spola-*-windows-x64-portable.zip
            smoke/window.png
