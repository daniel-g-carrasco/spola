name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # The sync engine, built from source in the Flatpak. Keep in step with the
  # manifest in build-aux/flatpak/ (the test job checks).
  RCLONE_VERSION: "1.75.2"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PyGObject, gettext, rclone and the validators
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-glib-2.0 gettext desktop-file-utils appstream
          pipx install ruff
          curl -fsSL -o rclone.zip "https://github.com/rclone/rclone/releases/download/v${RCLONE_VERSION}/rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          unzip -q rclone.zip
          echo "SPOLA_RCLONE=$PWD/rclone-v${RCLONE_VERSION}-linux-amd64/rclone" >> "$GITHUB_ENV"
      - run: ruff check --select F,E9,B .
      - run: python3 tools/compile_po.py
      - run: python3 -m unittest discover -s tests -v
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate data/io.github.daniel_g_carrasco.spola.desktop
          appstreamcli validate --no-net data/io.github.daniel_g_carrasco.spola.metainfo.xml
      - name: Check that the Flatpak manifest pins the same rclone
        run: grep -q "rclone-v${RCLONE_VERSION}.tar.gz" build-aux/flatpak/io.github.daniel_g_carrasco.spola.yaml
      - name: Check that the tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(python3 -c 'import sys; sys.path.insert(0, "src"); import spola as p; print(p.__version__)')"
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match __version__ = $v"; exit 1
          fi

  dolphin-plugin:
    # Dolphin's overlay plugin is built by its users, against their own KDE
    # Frameworks (extensions/dolphin/README.md): this checks that it still
    # builds and installs, against Fedora's
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v7
      - name: Install the KDE Frameworks headers
        run: dnf -y install --setopt=install_weak_deps=False cmake extra-cmake-modules gcc-c++ kf6-kio-devel qt6-qtbase-devel
      - name: Build and install for a user, as the README says
        run: |
          cmake -S extensions/dolphin -B build-dolphin -DCMAKE_INSTALL_PREFIX="$PWD/home/.local"
          cmake --build build-dolphin
          cmake --install build-dolphin
          find home/.local -path "*/kf6/overlayicon/spolaoverlayplugin.so" | grep .

  flatpak:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Install the Go SDK extension (rclone is built from source)
        run: flatpak install -y --noninteractive flathub org.freedesktop.Sdk.Extension.golang//25.08
      - name: Build
        run: |
          flatpak-builder --disable-rofiles-fuse --force-clean --ccache=false --repo=repo \
            build-dir build-aux/flatpak/io.github.daniel_g_carrasco.spola.yaml
          flatpak build-bundle repo spola.flatpak io.github.daniel_g_carrasco.spola stable \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@v7
        with:
          name: spola-flatpak
          path: spola.flatpak

  release:
    needs: [test, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: spola-flatpak
      - name: Publish the release
        run: gh release create "${GITHUB_REF_NAME}" spola.flatpak --repo "${GITHUB_REPOSITORY}" --title "Spola ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
