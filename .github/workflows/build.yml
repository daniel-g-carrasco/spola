name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# read-only for every job: only "release" below writes (the release itself);
# the tests, which run a downloaded rclone, get no token that writes
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  dolphin-plugin:
    # Dolphin's overlay plugin is built by its users, against their own KDE
    # Frameworks (extensions/dolphin/README.md): this checks that it still
    # builds and installs, against Fedora's
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the KDE Frameworks headers
        run: dnf -y install --setopt=install_weak_deps=False cmake extra-cmake-modules gcc-c++ kf6-kio-devel qt6-qtbase-devel
      - name: Build and install for a user, as the README says
        run: |
          cmake -S extensions/dolphin -B build-dolphin -DCMAKE_INSTALL_PREFIX="$PWD/home/.local"
          cmake --build build-dolphin
          cmake --install build-dolphin
          find home/.local -path "*/kf6/overlayicon/spolaoverlayplugin.so" | grep .

  flatpak:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Go SDK extension (rclone is built from source)
        run: flatpak install -y --noninteractive flathub org.freedesktop.Sdk.Extension.golang//25.08
      - name: Build
        run: |
          flatpak-builder --disable-rofiles-fuse --force-clean --ccache=false --repo=repo \
            build-dir build-aux/flatpak/io.github.daniel_g_carrasco.spola.yaml
          flatpak build-bundle repo spola.flatpak io.github.daniel_g_carrasco.spola stable \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: spola-flatpak
          path: spola.flatpak

  release:
    needs: [test, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: spola-flatpak
      - name: The release, a draft, with the Flatpak
        # made here if it is not there yet (a job run again finds it), never
        # published here: see the next step
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft \
              --title "Spola ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" spola.flatpak --repo "${GITHUB_REPOSITORY}" --clobber
      - name: Published when every file is there
        # release-complete: the same step, word for word, in build.yml and in
        # windows.yml (tests/test_release_complete.py compares them and runs
        # it). The release is a draft until the Flatpak and the Windows
        # installer and zip, with their signatures, are all there: the
        # installed app asks GitHub for the latest release, and a draft is
        # never that. Whichever workflow ends last finds every file and
        # publishes. 0.3.41 went out with the Flatpak alone.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          names="$(gh release view "$tag" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          missing=""
          for wanted in '\.flatpak$' \
                        "-setup-${tag}-windows-x64\.exe$" "-setup-${tag}-windows-x64\.exe\.minisig$" \
                        "-${tag}-windows-x64-portable\.zip$" "-${tag}-windows-x64-portable\.zip\.minisig$"; do
            echo "$names" | grep -Eq -- "$wanted" || missing="$missing $wanted"
          done
          if [ -n "$missing" ]; then
            echo "the release stays a draft, still missing:$missing"
          else
            gh release edit "$tag" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
            echo "release $tag published: every file is there"
          fi
