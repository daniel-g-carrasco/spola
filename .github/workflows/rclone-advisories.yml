name: Packaged rclone advisories

on:
  schedule:
    - cron: "43 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rclone-osv:
    name: Check pinned rclone with OSV
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/check_rclone_advisories.py
